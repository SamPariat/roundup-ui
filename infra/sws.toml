# static-web-server settings for the web export (https://static-web-server.net/configuration/config-file/).
# The Dockerfile copies this to /etc/sws.toml and replaces __API_ORIGIN__ with the origin of
# EXPO_PUBLIC_API_URL, so the page may call the API. Everything else is literal.

[general]
host = "::"
port = 3000
root = "/public"

# Served for any unknown path, with status 404. Relative paths resolve under root.
page404 = "+not-found.html"

# GET /health answers 200 and writes no log line. The compose healthcheck calls it.
health = true

# Exploring the folder is never useful; an unmatched directory is a 404.
directory-listing = false

# Gzip, Brotli, Deflate and Zstd on demand for text files.
compression = true

# Expo Router exports squads/index.html for /squads. Without this, SWS answers /squads with a
# 308 to /squads/; with it, /squads is served directly with status 200 and no redirect.
redirect-trailing-slash = false
index-files = "index.html"

ignore-hidden-files = true

# SIGTERM (docker stop) makes SWS stop accepting connections and finish in-flight requests.
# No extra delay is added.
grace-period = 0

[advanced]

# Security headers on every response. Expo's static export inlines a small bootstrap script and a
# reset stylesheet, so script-src and style-src allow 'unsafe-inline'. Everything else stays on
# this origin, plus the API origin for fetch calls.
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# Pages are revalidated on every load so a deploy shows at once. Clean URLs (/squads) have no
# extension, so the rule matches every path; the two rules below override it for assets.
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Files under _expo/static carry a content hash in their name, so they never change.
[[advanced.headers]]
source = "**/_expo/static/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Images and fonts that Expo copies to assets/ have no content hash in their URL: an hour, as before.
[[advanced.headers]]
source = "**/assets/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=3600"
