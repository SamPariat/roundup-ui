# SonarCloud settings. No project is connected yet: fill in sonar.organization and sonar.projectKey
# when one is created, then run the scanner after `pnpm test:coverage` (CI uploads nothing today).
# The same rules run locally through eslint-plugin-sonarjs (see shared/config/eslint.ts).
sonar.organization=
sonar.projectKey=SamPariat_roundup-ui
sonar.projectName=roundup-ui
sonar.sourceEncoding=UTF-8

# TypeScript only: every package keeps source in src/ and tests in tests/.
sonar.sources=apps/app/src,apps/server/src,shared/i18n/src,shared/tokens/src,shared/ui/src,shared/tokens/scripts,scripts
sonar.tests=apps/app/tests,apps/server/tests,shared/i18n/tests,shared/tokens/tests,shared/ui/tests
sonar.test.inclusions=**/tests/**
sonar.inclusions=**/*.ts,**/*.tsx

# Generated from tokens.json by `make tokens`; nothing to review there. SVG artwork is data.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,shared/tokens/src/tokens.ts,shared/tokens/src/theme.css,assets/**,**/*.d.ts
sonar.coverage.exclusions=**/tests/**,**/index.ts,**/*.config.ts,apps/server/src/main.ts,apps/app/src/app/**

# Jest writes lcov.info next to coverage-summary.json (see shared/config/jest-preset.ts).
sonar.javascript.lcov.reportPaths=apps/app/coverage/lcov.info,apps/server/coverage/lcov.info,shared/i18n/coverage/lcov.info,shared/tokens/coverage/lcov.info,shared/ui/coverage/lcov.info
