# The static web build, served on http://localhost:8081. Start it with `make docker-up`.
# Make passes --env-file apps/app/.env.<APP_ENV>, which supplies the variables below.
services:
  web:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-beta}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?run make setup to create apps/app/.env.beta}
    image: roundup-web
    ports:
      - '8081:3000'
    # The browser calls the API at EXPO_PUBLIC_API_URL (localhost:8080, the Go gateway from
    # roundup-monorepo on the host). This line lets the container itself reach the host
    # gateway too, as host.docker.internal:8080, for anything the server proxies later.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
