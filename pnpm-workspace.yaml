# pnpm's release-age rule (refuse versions under a day old) is off for installs, so local work
# never blocks and no exclude list grows with each upgrade. CI enforces it on the versions a PR adds
# to the lockfile instead: scripts/check-release-age.sh.
minimumReleaseAge: 0

# react-native-css compiles native styles with the lightningcss that @expo/metro-config uses, and
# lightningcss 1.30.2 and later cannot read a var() back from its visitor, so every native bundle
# failed with "failed to deserialize ... Specifier". Hold that copy at the catalog's 1.30.1 until a fixed release.
overrides:
  '@expo/metro-config>lightningcss': 'catalog:'
