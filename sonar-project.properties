# SonarCloud settings. No project is connected yet: fill in sonar.organization and sonar.projectKey
# when one is created. The same rules run locally through eslint-plugin-sonarjs (see eslint.config.ts).
sonar.organization=
sonar.projectKey=SamPariat_roundup-ui
sonar.projectName=roundup-ui
sonar.sourceEncoding=UTF-8

# TypeScript only: every package keeps source in src/ and tests in tests/.
sonar.sources=apps/roundup/src,shared/i18n/src,shared/ui/src,scripts
sonar.tests=apps/roundup/tests,shared/i18n/tests,shared/ui/tests
sonar.test.inclusions=**/tests/**
sonar.inclusions=**/*.ts,**/*.tsx

# SVG artwork is data.

