name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job installs the same way: pnpm from "packageManager", Node from .nvmrc, the frozen lockfile.
env:
  APP_ENV: beta
  EXPO_PUBLIC_API_URL: http://localhost:8080

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the PR's commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier
        run: pnpm fmt-check

      - name: knip
        run: pnpm knip

      - name: syncpack
        run: pnpm syncpack

      - name: no js files
        run: pnpm files

      # expo install --check, then expo-doctor. Any issue fails the job.
      - name: expo doctor
        run: pnpm run doctor

      - name: commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: jest
        run: pnpm test

  # make tokens, then fail if the committed generated files differ.
  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate tokens
        run: pnpm tokens
      - name: committed files match
        run: git diff --exit-code

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: expo export
        run: pnpm --filter @roundup/app run export:web

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built into the local Docker daemon for the smoke test below; the image is not pushed anywhere.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: roundup-web:ci
          build-args: |
            APP_ENV=beta
            EXPO_PUBLIC_API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Run the image, wait for its health check, then assert clean URLs, the 404 page and the headers.
      - name: smoke test
        run: |
          docker run -d --name web -p 8081:3000 roundup-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/docker-smoke.ts http://localhost:8081

      - name: container logs
        if: failure()
        run: docker logs web

      - name: stop
        if: always()
        run: docker stop web

  # New releases appear without any change in this repo, so this job is informative: it is not in
  # ci-ok and cannot turn a pull request red. updates.yml runs the same check weekly and fails.
  updates:
    name: updates
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dependency updates
        run: pnpm run updates

  # The only check the main-branch ruleset requires. Job names can change as jobs are added or
  # split, so the ruleset points here instead of at them.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, drift, web, docker]
    if: always()
    steps:
      - name: All jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)"
              exit 1
            fi
          done
