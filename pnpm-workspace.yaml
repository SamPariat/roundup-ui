packages:
  - apps/*
  - shared/*

# Build scripts are blocked by default in pnpm 12. Only these two may run one:
# @parcel/watcher compiles the file watcher Metro uses, and unrs-resolver is the
# native resolver behind eslint-plugin-import-x and knip. esbuild (orval bundles its config with
# it) only runs a postinstall that checks its binary, which already arrives as a prebuilt package.
allowBuilds:
  '@parcel/watcher': true
  esbuild: false
  unrs-resolver: true

# eslint-plugin-react-native-a11y declares eslint ^3 to ^8, but it runs on ESLint 9 (every one of its
# rules loads and reports; eslint.config.ts turns them all on). ESLint 9 rather than 10 because
# this plugin and eslint-plugin-react-native stop there. Nothing else is relaxed.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react-native-a11y>eslint: '9'

